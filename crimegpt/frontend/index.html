<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://img.icons8.com/color/48/police-badge.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA / offline-first (P8) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F8FAFC" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B1220" />
    
    <!-- SEO Meta Tags -->
    <title>CrimeGPT — AI-Assisted Investigation & Legal Document Generator</title>
    <meta name="description" content="State-of-the-art AI portal for Non-Technical Investigating Officers. Automated BNS/BNSS/BSA classification, Indian Kanoon case laws, and digital-evidence secure document generation with SHA-256 and Section 63 certificates." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=Lato:wght@400;700;900&family=Noto+Sans+Devanagari:wght@400;700&family=Noto+Sans+Gujarati:wght@400;700&family=Noto+Serif+Devanagari:wght@600&family=Noto+Serif+Gujarati:wght@600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Apply the saved colour scheme before first paint, otherwise a saved dark
         preference flashes the light palette on every reload. Key and attribute
         match the MUI cssVariables config in src/theme.ts. -->
    <script>
      try {
        var m = localStorage.getItem('mui-mode');
        if (m === 'system') {
          m = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        // No stored choice means light — this must match defaultMode in App.tsx,
        // or a dark-OS user gets a dark flash before React settles on light.
        document.documentElement.setAttribute('data-mui-color-scheme', m || 'light');
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
